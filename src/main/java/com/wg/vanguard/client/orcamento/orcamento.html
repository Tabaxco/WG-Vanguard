<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orçamento — WG Vanguard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="orcamento.css"/>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      </svg>
    </div>
  </div>

  <div class="sidebar-profile">
    <div class="avatar">
      <svg width="32" height="32" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <span class="avatar-dot"></span>
    </div>
    <span class="sidebar-name">Administrador</span>
  </div>

  <nav>
    <a class="nav-item active" href="#">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
      </svg>
      Orçamento
    </a>
    <a class="nav-item" href="../funcionario/funcionario.html">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Funcionário
    </a>
    <a class="nav-item" href="../estoque/estoque.html">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      </svg>
      Estoque
    </a>
  </nav>
</aside>

<main class="main">
  <h1 class="page-title">Gerenciamento de Orçamento <span>— Detalhes do Orçamento</span></h1>

  <div class="search-bar">
    <div class="search-wrap">
      <span class="s-icon">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </span>
      <input type="text" id="searchInput" placeholder="Pesquisar por ID..."/>
    </div>
    <button class="btn-search" onclick="pesquisar()">Pesquisar</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div class="card" style="margin-bottom: 20px;">
    <div class="card-title">Dados do Cliente</div>
    <div class="form-grid three">

      <div class="field">
        <label>Nome do Cliente</label>
        <div class="input-wrap">
          <span class="fi">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <input type="text" id="nomeCliente" placeholder="Nome completo"/>
        </div>
      </div>

      <div class="field">
        <label>CPF</label>
        <div class="input-wrap">
          <span class="fi">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/>
            </svg>
          </span>
          <input type="text" id="cpf" placeholder="000.000.000-00" oninput="mascCPF(this)" maxlength="14"/>
        </div>
      </div>

      <div class="field">
        <label>Telefone</label>
        <div class="input-wrap">
          <span class="fi">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 3.08 4.18 2 2 0 0 1 5.07 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.71 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.58 2.81.71A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <input type="text" id="tel" placeholder="(00) 00000-0000" oninput="mascTel(this)" maxlength="15"/>
        </div>
      </div>

      <div class="field">
        <label>Status</label>
        <div class="input-wrap select-wrap">
          <span class="fi">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          </span>
          <select id="statusOrc">
            <option value="">Selecione...</option>
            <option>Pendente</option>
            <option>Aprovado</option>
            <option>Cancelado</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Data do Orçamento</label>
        <div class="input-wrap">
          <span class="fi">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
          <input type="date" id="dataOrc"/>
        </div>
      </div>

      <div class="field">
        <label>ID do Orçamento</label>
        <div class="input-wrap">
          <span class="fi">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/>
            </svg>
          </span>
          <input type="text" id="idOrc" readonly placeholder="Gerado automaticamente"/>
        </div>
      </div>

      <div class="field full">
        <label>Observações</label>
        <div class="input-wrap">
          <span class="fi">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </span>
          <input type="text" id="obs" placeholder="Ex: cliente prefere entrega, aguardando nova coleção..."/>
        </div>
      </div>

    </div>
  </div>

  <div class="card" style="margin-bottom: 20px;">
    <div class="card-title">Itens do Orçamento</div>

    <div class="items-header">
      <span>Peça / Referência</span>
      <span>Categoria</span>
      <span>Cor</span>
      <span>Tamanho</span>
      <span>Qtd.</span>
      <span>Preço Unit.</span>
      <span></span>
    </div>

    <div id="itemsList"></div>

    <button class="btn btn-add-item" onclick="adicionarItem()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Adicionar Peça
    </button>

    <div class="totals">
      <div class="total-row">
        <span class="total-label">Subtotal</span>
        <span class="total-value" id="subtotal">R$ 0,00</span>
      </div>
      <div class="total-row">
        <span class="total-label">Desconto (%)</span>
        <span class="total-value">
          <input class="discount-input" type="number" id="desconto" value="0" min="0" max="100" step="1" oninput="calcTotals()"/>
        </span>
      </div>
      <div class="total-divider"></div>
      <div class="total-row grand">
        <span class="total-label">Total</span>
        <span class="total-value" id="totalGeral">R$ 0,00</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <button class="btn btn-delete" onclick="deletar()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
        Deletar
      </button>
      <div class="actions-right">
        <button class="btn btn-save" onclick="salvar()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          Salvar Edição
        </button>
        <button class="btn btn-add" onclick="novoOrcamento()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Novo Orçamento
        </button>
      </div>
    </div>
  </div>

</main>

<script src="orcamento.js"></script>
</body>
</html>
