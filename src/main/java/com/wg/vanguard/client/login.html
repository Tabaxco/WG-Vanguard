<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #dcdcdc;
            height: 100vh;
            padding: 6px;
        }


        .window {
            width: 100%;
            height: 100%;
            border: 2px solid #000;
            background: #dddddd;
            position: relative;
        }


        .top-bar {
            height: 26px;
            border-bottom: 2px solid #000;
            display: flex;
            align-items: center;
            padding-left: 12px;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
        }

        /* Área central */
        .content {
            height: calc(100% - 26px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 70px;
            color: #000;
        }

        .form-group {
            width: 100%;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 9px;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: #000;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #777;
            background: #f3f3f3;
            padding: 10px;
            outline: none;
            font-size: 14px;
        }

        button {
            margin-top: 28px;
            width: 150px;
            height: 42px;
            border: none;
            background: #000;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="window">

    <div class="top-bar">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="content">

        <div class="login-box">

            <h1>Login</h1>

            <div class="form-group">
                <label>EMAIL</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>SENHA</label>
                <input type="password">
            </div>

            <button onclick="login()">
                Entrar
            </button>

        </div>

    </div>

</div>

<script>
    function login() {
        alert("Login enviado!");
    }
</script>

</body>
</html>
